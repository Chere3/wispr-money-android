name: Reportar un error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **No pegues montos, nombres de cuentas ni capturas con datos financieros reales.** Si una
        captura ayuda, tápalos o reprodúcelo con el servidor de demostración (`scripts/demo_server.py`).
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué viste. Incluye el texto exacto del error si lo hay.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Abrir Flujo
        2. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Dónde
      options: [Hoy, Movimientos, Alta de movimiento, Flujo, Patrimonio, Widget, Notificación, Conexión / configuración, Otro]
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión de Android
      placeholder: "Pixel 9, Android 16"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: "0.1.0"
